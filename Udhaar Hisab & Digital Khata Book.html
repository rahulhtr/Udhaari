<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

  <!-- html2pdf.js for Client-Side Statement PDF Generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              900: '#312e81',
              950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* iOS Momentum Scrolling and Tap Highlight removal */
    * {
      -webkit-tap-highlight-color: transparent;
    }
    body {
      touch-action: manipulation;
      user-select: none;
    }
    input, textarea {
      user-select: text;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Haptic Error Shake */
    @keyframes hapticShake {
      0%, 100% { transform: translateX(0); }
      15%, 45%, 75% { transform: translateX(-6px); }
      30%, 60%, 90% { transform: translateX(6px); }
    }
    .shake-error {
      animation: hapticShake 0.4s ease-in-out;
    }

    /* Print styling */
    @media print {
      body * {
        visibility: hidden !important;
      }
      #pdf-statement-canvas, #pdf-statement-canvas * {
        visibility: visible !important;
      }
      #pdf-statement-canvas {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 12mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 antialiased font-sans selection:bg-brand-100">

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- EMBEDDED LUCIDE SVG ICONS ---
    const Icon = ({ name, className = "w-5 h-5", strokeWidth = 2 }) => {

        shieldCheck: <><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></>,
        lock: <><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>,
        users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
        pieChart: <><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></>,
        deleteKey: <><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" x2="12" y1="9" y2="15"/><line x1="12" x2="18" y1="9" y2="15"/></>,

      return (
        <svg 
          xmlns="http://www.w3.org/2000/svg" 
          viewBox="0 0 24 24" 
          fill="none" 
          stroke="currentColor" 
          strokeWidth={strokeWidth} 
          strokeLinecap="round" 
          strokeLinejoin="round" 
          className={className}
        >
          {icons[name] || <circle cx="12" cy="12" r="10" />}
        </svg>
      );
    };

    // Google Logo SVG
    const GoogleIcon = ({ className = "w-5 h-5" }) => (
      <svg className={className} viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
    );

    // Initial Database
    const DEFAULT_DATA = {
      version: "4.0",
      lastSyncedAt: null,
      profile: {
        businessName: "Agrawal Kirana Store",
        ownerName: "Sunil Agrawal",
        phone: "+91 98290 12345",
        upiId: "sunilagrawal@okhdfcbank",
        address: "Shop 12, Main Market, Delhi",
        currencySymbol: "₹"
      },
      driveConfig: {
        clientId: ""
      },
      customers: [
        {
          id: "cust_1",
          name: "Ramesh Sharma",
          phone: "+91 98765 43210",
          notes: "Flat 402, Royal Residency",
          createdAt: "2026-10-01T10:00:00Z"
        },
        {
          id: "cust_2",
          name: "Pooja Gupta",
          phone: "+91 94140 88219",
          notes: "Monthly ration customer",
          createdAt: "2026-10-05T14:30:00Z"
        },
        {
          id: "cust_3",
          name: "Deepak Sweets & Dairy",
          phone: "+91 98280 77123",
          notes: "Sugar and milk wholesale",
          createdAt: "2026-10-10T09:15:00Z"
        }
      ],
      transactions: [
        {
          id: "tx_1",
          customerId: "cust_1",
          type: "GAVE",
          amount: 2500,
          paymentMode: "Credit/Khata",
          date: "2026-10-18T10:00:00Z",
          description: "10kg Flour, Oil, Spices",
          billNo: "INV-102"
        },
        {
          id: "tx_2",
          customerId: "cust_1",
          type: "GOT",
          amount: 1000,
          paymentMode: "UPI",
          date: "2026-10-20T17:30:00Z",
          description: "Paytm QR scan payment",
          billNo: "UPI-409"
        },
        {
          id: "tx_3",
          customerId: "cust_2",
          type: "GOT",
          amount: 3000,
          paymentMode: "Cash",
          date: "2026-10-15T12:00:00Z",
          description: "Advance cash given",
          billNo: "ADV-01"
        },
        {
          id: "tx_4",
          customerId: "cust_2",
          type: "GAVE",
          amount: 1800,
          paymentMode: "Credit/Khata",
          date: "2026-10-21T18:00:00Z",
          description: "Dry Fruits & Ghee",
          billNo: "INV-118"
        },
        {
          id: "tx_5",
          customerId: "cust_3",
          type: "GAVE",
          amount: 6500,
          paymentMode: "Credit/Khata",
          date: "2026-10-16T11:00:00Z",
          description: "Bulk sugar sacks (50kg)",
          billNo: "WH-22"
        }
      ]
    };

    const MASTER_SECRET_KEY = "158400";
    const DB_STORAGE_KEY = "UDHAAR_KHATA_APP_DB_PRO";
    const SESSION_STORAGE_KEY = "UDHAAR_AUTH_SESSION_KEY";
    const G_DRIVE_FILENAME = "udhaar_khata_database.json";

    function App() {
      // --- AUTH STATE ---
      const [authSession, setAuthSession] = useState(() => {
        try {
          const saved = sessionStorage.getItem(SESSION_STORAGE_KEY);
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      // PIN State (Completely hidden: no 158400 on screen)
      const [pinDigits, setPinDigits] = useState("");
      const [isPinShaking, setIsPinShaking] = useState(false);
      const [authMode, setAuthMode] = useState("PIN"); // 'PIN' or 'GOOGLE'

      // Application Database State
      const [appData, setAppData] = useState(() => {
        try {
          const local = localStorage.getItem(DB_STORAGE_KEY);
          if (local) return JSON.parse(local);
        } catch (e) {}
        return DEFAULT_DATA;
      });

      // App View State
      const [currentTab, setCurrentTab] = useState("CUSTOMERS"); // 'CUSTOMERS', 'ANALYTICS', 'SETTINGS'
      const [searchQuery, setSearchQuery] = useState("");
      const [activeFilter, setActiveFilter] = useState("ALL"); // 'ALL', 'RECEIVE', 'PAY', 'SETTLED'
      const [selectedCustomerId, setSelectedCustomerId] = useState(null);

      // Modals
      const [isTxModalOpen, setIsTxModalOpen] = useState(false);
      const [txType, setTxType] = useState("GAVE");
      const [isAddCustomerOpen, setIsAddCustomerOpen] = useState(false);
      const [isPdfModalOpen, setIsPdfModalOpen] = useState(false);
      const [isGoogleDriveModalOpen, setIsGoogleDriveModalOpen] = useState(false);
      const [isStoreProfileOpen, setIsStoreProfileOpen] = useState(false);

      // Cloud & PDF States
      const [driveAccessToken, setDriveAccessToken] = useState(null);
      const [isSyncingDrive, setIsSyncingDrive] = useState(false);
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);
      const [toastNotice, setToastNotice] = useState(null);

      const jsonFileInputRef = useRef(null);
      const pdfPrintRef = useRef(null);

      // Auto-save to localStorage
      useEffect(() => {
        try {
          localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(appData));
        } catch (e) {}
      }, [appData]);

      // Session Storage
      useEffect(() => {
        if (authSession) {
          sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(authSession));
        } else {
          sessionStorage.removeItem(SESSION_STORAGE_KEY);
        }
      }, [authSession]);

      const showToast = (message, type = "success") => {
        setToastNotice({ message, type });
        setTimeout(() => setToastNotice(null), 3200);
      };

      // --- PIN SECURITY HANDLER (No code displayed) ---
      const handleKeyPress = (digit) => {
        if (pinDigits.length >= 6) return;
        const newPin = pinDigits + digit;
        setPinDigits(newPin);

        if (newPin === MASTER_SECRET_KEY) {
          // Instant unlock
          const session = {
            authenticated: true,
            method: "PIN",
            time: new Date().toISOString()
          };
          setAuthSession(session);
          setPinDigits("");
          showToast("Khata Book Unlocked");
        } else if (newPin.length === 6) {
          // Wrong PIN - Shake and clear
          setIsPinShaking(true);
          setTimeout(() => {
            setPinDigits("");
            setIsPinShaking(false);
          }, 500);
        }
      };

      const handleKeyBackspace = () => {
        setPinDigits(prev => prev.slice(0, -1));
      };

      const handleLogout = () => {
        setAuthSession(null);
        setSelectedCustomerId(null);
        setPinDigits("");
        showToast("Session Locked", "info");
      };

      // --- GOOGLE SIGN IN ---
      const handleGoogleLogin = () => {
        const clientId = appData.driveConfig.clientId.trim();
        if (!clientId) {
          showToast("Set your Google OAuth 2.0 Client ID in Settings", "error");
          setIsGoogleDriveModalOpen(true);
          return;
        }

        if (!window.google?.accounts?.oauth2) {
          showToast("Google Identity Services loading...", "error");
          return;
        }

        try {
          const client = window.google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: "https://www.googleapis.com/auth/drive.appdata https://www.googleapis.com/auth/userinfo.email",
            callback: (res) => {
              if (res && res.access_token) {
                setDriveAccessToken(res.access_token);
                setAuthSession({
                  authenticated: true,
                  method: "GOOGLE",
                  token: res.access_token,
                  time: new Date().toISOString()
                });
                showToast("Signed in with Google");
              }
            }
          });
          client.requestAccessToken();
        } catch (err) {
          showToast("Google OAuth failed to initialize", "error");
        }
      };

      // --- BALANCE COMPUTATIONS ---
      const customerSummaries = useMemo(() => {
        const map = {};
        appData.customers.forEach(c => {
          map[c.id] = { totalGave: 0, totalGot: 0, balance: 0, txCount: 0, lastDate: c.createdAt };
        });

        appData.transactions.forEach(tx => {
          if (map[tx.customerId]) {
            if (tx.type === "GAVE") {
              map[tx.customerId].totalGave += Number(tx.amount);
            } else {
              map[tx.customerId].totalGot += Number(tx.amount);
            }
            map[tx.customerId].txCount += 1;
            if (new Date(tx.date) > new Date(map[tx.customerId].lastDate)) {
              map[tx.customerId].lastDate = tx.date;
            }
          }
        });

        Object.keys(map).forEach(id => {
          // Positive: You will receive (Lena Hai)
          // Negative: You have to give / Advance (Dena Hai)
          map[id].balance = map[id].totalGave - map[id].totalGot;
        });

        return map;
      }, [appData.customers, appData.transactions]);

      const { totalLenaHai, totalDenaHai, netBalance } = useMemo(() => {
        let receive = 0;
        let give = 0;
        Object.values(customerSummaries).forEach(s => {
          if (s.balance > 0) receive += s.balance;
          else if (s.balance < 0) give += Math.abs(s.balance);
        });
        return {
          totalLenaHai: receive,
          totalDenaHai: give,
          netBalance: receive - give
        };
      }, [customerSummaries]);

      // Filtered customers
      const filteredCustomers = useMemo(() => {
        return appData.customers
          .filter(c => {
            const q = searchQuery.trim().toLowerCase();
            const matches = c.name.toLowerCase().includes(q) || c.phone.replace(/\s+/g, '').includes(q);
            if (!matches) return false;

            const bal = customerSummaries[c.id]?.balance || 0;
            if (activeFilter === "RECEIVE") return bal > 0;
            if (activeFilter === "PAY") return bal < 0;
            if (activeFilter === "SETTLED") return bal === 0;
            return true;
          })
          .sort((a, b) => {
            const dA = new Date(customerSummaries[a.id]?.lastDate || a.createdAt);
            const dB = new Date(customerSummaries[b.id]?.lastDate || b.createdAt);
            return dB - dA;
          });
      }, [appData.customers, searchQuery, activeFilter, customerSummaries]);

      const currentCustomer = useMemo(() => {
        return appData.customers.find(c => c.id === selectedCustomerId) || null;
      }, [appData.customers, selectedCustomerId]);

      // Running Balance Entries
      const currentLedgerEntries = useMemo(() => {
        if (!selectedCustomerId) return [];

        const asc = [...appData.transactions]
          .filter(t => t.customerId === selectedCustomerId)
          .sort((a, b) => new Date(a.date) - new Date(b.date));

        let running = 0;
        const withBalance = asc.map(item => {
          if (item.type === "GAVE") {
            running += Number(item.amount);
          } else {
            running -= Number(item.amount);
          }
          return { ...item, runningBalance: running };
        });

        return withBalance.reverse();
      }, [appData.transactions, selectedCustomerId]);

      const activeCustomerBalance = currentCustomer ? (customerSummaries[currentCustomer.id]?.balance || 0) : 0;

      // --- RECORD TRANSACTIONS ---
      const handleSaveTransaction = (form) => {
        if (!selectedCustomerId) return;
        const entry = {
          id: "tx_" + Date.now(),
          customerId: selectedCustomerId,
          type: form.type,
          amount: parseFloat(form.amount),
          paymentMode: form.paymentMode || "Cash",
          date: form.date ? new Date(form.date).toISOString() : new Date().toISOString(),
          description: form.description || (form.type === "GAVE" ? "Udhaar Diya" : "Jama Mila"),
          billNo: form.billNo?.trim() || ""
        };

        setAppData(prev => ({
          ...prev,
          transactions: [entry, ...prev.transactions]
        }));

        setIsTxModalOpen(false);
        showToast(form.type === "GAVE" ? `₹${form.amount} Given (Diya)` : `₹${form.amount} Received (Mila)`);
      };

      const handleDeleteTransaction = (id) => {
        setAppData(prev => ({
          ...prev,
          transactions: prev.transactions.filter(t => t.id !== id)
        }));
        showToast("Entry deleted", "info");

      // --- ADD CUSTOMER ---
      const handleSaveCustomer = (form) => {

        const newCustomer = {
          id,
          name: form.name.trim(),
          phone: form.phone.trim(),
          notes: form.notes?.trim() || "",
          createdAt: new Date().toISOString()

        let txList = [...appData.transactions];
        const initial = parseFloat(form.initialBalance);
        if (initial && initial > 0) {
          txList.push({
            id: "tx_" + Date.now(),
            customerId: id,
            type: form.initialType || "GAVE",
            amount: initial,
            paymentMode: "Opening Balance",
            date: new Date().toISOString(),
            description: "Opening Balance (Pichla Hisab)",
            billNo: "OPN"
          });
        }

        setAppData(prev => ({
          ...prev,
          customers: [newCustomer, ...prev.customers],
          transactions: txList
        }));

        setSelectedCustomerId(id);
        setIsAddCustomerOpen(false);
        showToast(`Added ${newCustomer.name}`);
      };

      const handleDeleteCustomer = (id) => {
        const cust = appData.customers.find(c => c.id === id);
        if (!confirm(`Permanently remove ${cust?.name}?`)) return;

        setAppData(prev => ({
          ...prev,
          customers: prev.customers.filter(c => c.id !== id),
          transactions: prev.transactions.filter(t => t.customerId !== id)
        }));

        setSelectedCustomerId(null);
        showToast("Account removed", "info");
      };

      // --- 1-CLICK WHATSAPP REMINDER ---
      const sendWhatsAppReminder = () => {
        if (!currentCustomer) return;
        const cleanPhone = currentCustomer.phone.replace(/[^0-9]/g, "");
        const bal = activeCustomerBalance;
        const upi = appData.profile.upiId;
        const store = appData.profile.businessName;

        let msg = "";
        if (bal > 0) {
          msg = `*Namaste ${currentCustomer.name} Ji,*\n\n` +
                `This is a friendly account update from *${store}*.\n` +
                `Your pending balance is *₹${bal.toLocaleString("en-IN")}*.\n\n` +
                (upi ? `📲 *Pay via UPI:* ${upi}\n\n` : "") +
                `Kindly clear this pending amount when convenient.\n` +
                `For any questions, call: ${appData.profile.phone}.\n\n` +
                `_Thank you!_`;
        } else if (bal < 0) {
          msg = `*Namaste ${currentCustomer.name} Ji,*\n\n` +
                `Statement update from *${store}*.\n` +
                `You have an advance credit of *₹${Math.abs(bal).toLocaleString("en-IN")}* with us.\n\n` +
                `_Thank you for your business!_`;
        } else {
          msg = `*Namaste ${currentCustomer.name} Ji,*\n\n` +
                `Your account with *${store}* is fully settled (₹0.00).\n_Thank you!_`;
        }

        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, "_blank");
      };

      // --- PDF EXPORT ---
      const handleDownloadPdf = () => {
        if (!currentCustomer || !pdfPrintRef.current) return;
        setIsGeneratingPdf(true);

        const fileName = `Statement_${currentCustomer.name.replace(/\s+/g, '_')}_${new Date().toISOString().slice(0, 10)}.pdf`;

          margin: [8, 8, 8, 8],
          filename: fileName,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        if (window.html2pdf) {
          window.html2pdf()
            .set(opt)
            .from(pdfPrintRef.current)
            .save()
            .then(() => {
              setIsGeneratingPdf(false);
              showToast("PDF Statement downloaded");

            .catch(() => {
              setIsGeneratingPdf(false);
              window.print();
            });
        } else {
          setIsGeneratingPdf(false);
          window.print();

      // --- GOOGLE DRIVE SYNC ---
      const syncToDrive = async () => {
        if (!driveAccessToken) {
          showToast("Please authenticate with Google first", "error");
          setIsGoogleDriveModalOpen(true);
          return;
        }

        setIsSyncingDrive(true);
        try {
          const query = `name = '${G_DRIVE_FILENAME}' and trashed = false`;
          const searchUrl = `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${encodeURIComponent(query)}&fields=files(id,name)`;
          
          const searchRes = await fetch(searchUrl, {
            headers: { Authorization: `Bearer ${driveAccessToken}` }
          });
          const searchData = await searchRes.json();
          const existingFileId = searchData.files && searchData.files.length > 0 ? searchData.files[0].id : null;

          const payload = { ...appData, lastSyncedAt: new Date().toISOString() };
          const fileContent = JSON.stringify(payload, null, 2);

          const metadata = {
            name: G_DRIVE_FILENAME,
            mimeType: "application/json",
            ...(existingFileId ? {} : { parents: ["appDataFolder"] })
          };

          const boundary = "-------314159265358979323846";
          const delimiter = "\r\n--" + boundary + "\r\n";
          const close_delim = "\r\n--" + boundary + "--";

          const body =
            delimiter +
            "Content-Type: application/json; charset=UTF-8\r\n\r\n" +
            JSON.stringify(metadata) +
            delimiter +
            "Content-Type: application/json\r\n\r\n" +
            fileContent +
            close_delim;

          const uploadUrl = existingFileId
            ? `https://www.googleapis.com/upload/drive/v3/files/${existingFileId}?uploadType=multipart`
            : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

          const res = await fetch(uploadUrl, {
            method: existingFileId ? "PATCH" : "POST",
            headers: {
              Authorization: `Bearer ${driveAccessToken}`,
              "Content-Type": `multipart/related; boundary=${boundary}`
            },
            body
          });

          const data = await res.json();
          if (data.id) {
            setAppData(prev => ({ ...prev, lastSyncedAt: new Date().toISOString() }));
            showToast("Database backed up to Google Drive!");
          } else {
            throw new Error(data.error?.message || "Sync failed");
          }
        } catch (e) {
          showToast(e.message || "Failed to sync with Google Drive", "error");
        } finally {
          setIsSyncingDrive(false);
        }

        reader.readAsText(file);
        e.target.value = null;

                    <input
                      required
                      name="name"
                      placeholder="e.g. Rajesh Kumar"
                      className="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Mobile / WhatsApp Number *</label>
                    <input
                      required
                      name="phone"
                      type="tel"
                      placeholder="+91 98765 43210"
                      className="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Opening Balance (₹)</label>
                      <input
                        name="initialBalance"
                        type="number"
                        min="0"
                        placeholder="0"
                        className="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Type</label>
                      <select
                        name="initialType"
                        className="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none bg-white"
                      >
                        <option value="GAVE">Lena Hai (Debit)</option>
                        <option value="GOT">Dena Hai (Advance)</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Address / Landmark (Optional)</label>
                    <input
                      name="notes"
                      placeholder="e.g. Flat #201, Sector 2"
                      className="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsAddCustomerOpen(false)}
                      className="flex-1 py-3 border border-slate-200 text-slate-700 font-bold rounded-xl text-xs hover:bg-slate-50"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-3 bg-brand-600 hover:bg-brand-700 text-white font-bold rounded-xl text-xs shadow-md transition"
                    >
                      Save Account
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL 3: PDF STATEMENT PREVIEW */}
          {isPdfModalOpen && currentCustomer && (
            <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
              <div className="bg-white rounded-3xl max-w-2xl w-full shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="p-3 bg-slate-950 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="fileText" className="w-4 h-4 text-emerald-400" />
                    <h3 className="font-bold text-xs sm:text-sm">Account Statement</h3>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={handleDownloadPdf}
                      disabled={isGeneratingPdf}
                      className="px-3 py-1 bg-brand-600 hover:bg-brand-700 text-white rounded-lg text-xs font-bold flex items-center gap-1"
                    >
                      <Icon name="download" className="w-3.5 h-3.5" />
                      <span>{isGeneratingPdf ? "Generating..." : "Download PDF"}</span>
                    </button>
                    <button onClick={() => setIsPdfModalOpen(false)} className="text-slate-400 hover:text-white p-1">
                      <Icon name="x" className="w-4 h-4" />
                    </button>
                  </div>
                </div>

                {/* Printable Canvas */}
                <div className="p-4 overflow-y-auto flex-1 bg-slate-100">
                  <div
                    ref={pdfPrintRef}
                    id="pdf-statement-canvas"
                    className="bg-white p-6 rounded-2xl shadow-xs border border-slate-200 text-slate-800 space-y-4"
                  >
                    <div className="border-b-2 border-slate-900 pb-3 flex justify-between items-start">
                      <div>
                        <h2 className="text-xl font-black text-slate-900 uppercase">
                          {appData.profile.businessName}
                        </h2>
                        <p className="text-xs text-slate-500">{appData.profile.address}</p>
                        <p className="text-xs text-slate-700 font-semibold mt-0.5">
                          Ph: {appData.profile.phone} {appData.profile.upiId ? `| UPI: ${appData.profile.upiId}` : ""}
                        </p>
                      </div>
                      <div className="text-right">
                        <span className="px-2 py-0.5 bg-slate-100 text-slate-800 font-bold text-[10px] rounded-full uppercase">
                          Statement
                        </span>
                        <p className="text-[10px] text-slate-400 mt-1 font-mono">
                          {new Date().toLocaleDateString("en-IN", { day: '2-digit', month: 'short', year: 'numeric' })}
                        </p>
                      </div>
                    </div>

                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-center text-xs">
                      <div>
                        <p className="font-bold text-slate-900">{currentCustomer.name}</p>
                        <p className="text-slate-500 font-mono">{currentCustomer.phone}</p>
                      </div>
                      <div className="text-right">
                        <p className="text-[10px] uppercase font-bold text-slate-400">Net Due</p>
                        <p className={`text-base font-black ${activeCustomerBalance > 0 ? "text-emerald-700" : "text-rose-700"}`}>
                          ₹{Math.abs(activeCustomerBalance).toLocaleString("en-IN")}
                        </p>
                      </div>
                    </div>

                    <table className="w-full text-left text-[11px] border border-slate-200 rounded-lg overflow-hidden">
                      <thead className="bg-slate-100 font-bold text-slate-700">
                        <tr>
                          <th className="p-2">Date</th>
                          <th className="p-2">Particulars</th>
                          <th className="p-2 text-right text-rose-700">Gave (Diya)</th>
                          <th className="p-2 text-right text-emerald-700">Got (Mila)</th>
                          <th className="p-2 text-right">Balance</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {currentLedgerEntries.map(tx => (
                          <tr key={tx.id}>
                            <td className="p-2 whitespace-nowrap text-slate-500">
                              {new Date(tx.date).toLocaleDateString("en-IN", { day: '2-digit', month: 'short' })}
                            </td>
                            <td className="p-2 text-slate-800">
                              {tx.description}
                            </td>
                            <td className="p-2 text-right font-bold text-rose-600">
                              {tx.type === "GAVE" ? `₹${Number(tx.amount).toLocaleString("en-IN")}` : "-"}
                            </td>
                            <td className="p-2 text-right font-bold text-emerald-600">
                              {tx.type === "GOT" ? `₹${Number(tx.amount).toLocaleString("en-IN")}` : "-"}
                            </td>
                            <td className="p-2 text-right font-bold text-slate-700">
                              ₹{Math.abs(tx.runningBalance).toLocaleString("en-IN")} {tx.runningBalance >= 0 ? "Dr" : "Cr"}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>

                    <div className="pt-4 border-t border-slate-200 flex justify-between items-end text-[10px] text-slate-400">
                      <p>Generated by Udhaar Khata Digital Ledger</p>
                      <div className="text-right">
                        <div className="border-b border-slate-400 w-32 mb-1" />
                        <p className="font-bold text-slate-700">{appData.profile.businessName}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4: GOOGLE CLOUD OAUTH CONFIG */}
          {isGoogleDriveModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-sm text-slate-900">Google Drive Configuration</h3>
                  <button onClick={() => setIsGoogleDriveModalOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <div className="space-y-2">
                  <label className="block text-xs font-bold text-slate-700">Google OAuth 2.0 Client ID</label>
                  <input
                    type="text"
                    defaultValue={appData.driveConfig.clientId}
                    onChange={(e) => {
                      const val = e.target.value.trim();
                      setAppData(prev => ({
                        ...prev,
                        driveConfig: { ...prev.driveConfig, clientId: val }
                      }));
                    }}
                    placeholder="xxxxxxxx.apps.googleusercontent.com"
                    className="w-full px-3 py-2 text-xs font-mono border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500 focus:outline-none"
                  />
                  <p className="text-[10px] text-slate-400 leading-relaxed">
                    Obtain from Google Cloud Console with scope: <code className="font-mono">drive.appdata</code>
                  </p>
                </div>

                <button
                  type="button"
                  onClick={() => setIsGoogleDriveModalOpen(false)}
                  className="w-full py-2.5 bg-slate-950 text-white rounded-xl text-xs font-bold hover:bg-black transition"
                >
                  Save & Close
                </button>
              </div>
            </div>
          )}

          {/* MODAL 5: STORE PROFILE */}
          {isStoreProfileOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 animate-in fade-in">
              <div className="bg-white rounded-3xl max-w-sm w-full p-5 space-y-3.5 shadow-2xl">
                <div className="flex items-center justify-between">
                  <h3 className="font-bold text-sm text-slate-900">Edit Business Details</h3>
                  <button onClick={() => setIsStoreProfileOpen(false)} className="text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const fd = new FormData(e.currentTarget);
                    setAppData(prev => ({
                      ...prev,
                      profile: {
                        ...prev.profile,
                        businessName: fd.get("businessName"),
                        ownerName: fd.get("ownerName"),
                        phone: fd.get("phone"),
                        upiId: fd.get("upiId"),
                        address: fd.get("address")
                      }
                    }));
                    setIsStoreProfileOpen(false);
                    showToast("Business details updated");
                  }}
                  className="space-y-3"
                >
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Store Name *</label>
                    <input
                      name="businessName"
                      defaultValue={appData.profile.businessName}
                      required
                      className="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Owner Name</label>
                    <input
                      name="ownerName"
                      defaultValue={appData.profile.ownerName}
                      className="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Phone *</label>
                    <input
                      name="phone"
                      defaultValue={appData.profile.phone}
                      required
                      className="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">UPI ID (For WhatsApp payment reminders)</label>
                    <input
                      name="upiId"
                      defaultValue={appData.profile.upiId}
                      placeholder="e.g. yourname@okhdfcbank"
                      className="w-full px-3 py-2 text-xs font-mono border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 mb-1">Address (For Statement)</label>
                    <input
                      name="address"
                      defaultValue={appData.profile.address}
                      className="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 bg-brand-600 text-white rounded-xl text-xs font-bold hover:bg-brand-700 transition mt-2"
                  >
                    Save Changes
                  </button>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
