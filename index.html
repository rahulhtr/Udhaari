<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Udhaar Khata Pro - Digital Bahi Khata</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM 18 -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>
  <!-- html2pdf for PDF Statements -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #020617;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, textarea, select {
      user-select: text;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake 0.4s ease-in-out;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const STORAGE_KEY = 'udhaar_khata_v3_db';
    const AUTH_KEY = 'udhaar_khata_v3_auth';
    const MASTER_PIN = '158400';

    const INITIAL_DATA = {
      profile: {
        businessName: 'Apna General & Kirana Store',
        ownerName: 'Shop Owner',
        phone: '+91 9876543210',
        upiId: 'merchant@upi',
        address: 'Main Market Road, New Delhi',
        googleClientId: ''
      },
      customers: [
        { id: 'c1', name: 'Ramesh Kumar', phone: '9876543210', address: 'Gali No. 4, Mohan Nagar', createdAt: '2026-10-01' },
        { id: 'c2', name: 'Suresh Halwai', phone: '9811223344', address: 'Main Bazaar Chowk', createdAt: '2026-10-05' },
        { id: 'c3', name: 'Anita Sharma', phone: '9988776655', address: 'Block C, Sagarpur', createdAt: '2026-10-10' }
      ],
      transactions: [
        { id: 't1', customerId: 'c1', type: 'GAVE', amount: 2500, date: '2026-10-15', time: '10:30 AM', mode: 'Khata', billNo: 'INV-101', note: '10kg Aata, 5L Mustard Oil' },
        { id: 't2', customerId: 'c1', type: 'GOT', amount: 1000, date: '2026-10-18', time: '04:15 PM', mode: 'UPI', billNo: 'UPI-882', note: 'PhonePe Part Payment' },
        { id: 't3', customerId: 'c2', type: 'GAVE', amount: 4200, date: '2026-10-19', time: '11:00 AM', mode: 'Khata', billNo: 'INV-108', note: '50kg Sugar Sack' },
        { id: 't4', customerId: 'c3', type: 'GOT', amount: 500, date: '2026-10-20', time: '06:45 PM', mode: 'Cash', billNo: 'ADV-03', note: 'Advance Booking Deposit' }
      ],
      lastSynced: null
    };

    function App() {
      // Auth State
      const [auth, setAuth] = useState(() => {
        try {
          const saved = sessionStorage.getItem(AUTH_KEY);
          return saved ? JSON.parse(saved) : { isAuthenticated: false, method: null, email: null };
        } catch {
          return { isAuthenticated: false, method: null, email: null };
        }
      });
      const [loginTab, setLoginTab] = useState('PIN'); // 'PIN' or 'GMAIL'
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      // Database State
      const [db, setDb] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : INITIAL_DATA;
        } catch {
          return INITIAL_DATA;
        }
      });

      // Navigation & UI State
      const [activeTab, setActiveTab] = useState('KHATA'); // KHATA, REPORTS, SETTINGS
      const [selectedCustomerId, setSelectedCustomerId] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [filterType, setFilterType] = useState('ALL'); // ALL, LENA, DENA, SETTLED

      // Modals State
      const [showCustomerModal, setShowCustomerModal] = useState(false);
      const [editingCustomer, setEditingCustomer] = useState(null);
      const [customerForm, setCustomerForm] = useState({ name: '', phone: '', address: '', openingBalance: '', openingType: 'GAVE' });

      const [showTxModal, setShowTxModal] = useState(false);
      const [editingTx, setEditingTx] = useState(null);
      const [txForm, setTxForm] = useState({
        type: 'GAVE',
        amount: '',
        date: new Date().toISOString().split('T')[0],
        mode: 'Cash',
        billNo: '',
        note: ''
      });

      // Custom Confirmation Dialog State (No browser confirm/alert)
      const [confirmDialog, setConfirmDialog] = useState(null);

      const [showPdfModal, setShowPdfModal] = useState(false);
      const [showDriveModal, setShowDriveModal] = useState(false);
      const [driveStatus, setDriveStatus] = useState('Idle');
      const [accessToken, setAccessToken] = useState(null);
      const [toast, setToast] = useState(null);

      // Save DB to LocalStorage
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        } catch (err) {
          console.error('Failed to save to localStorage', err);
        }
      }, [db]);

      // Save Auth to SessionStorage
      useEffect(() => {
        try {
          sessionStorage.setItem(AUTH_KEY, JSON.stringify(auth));
        } catch (err) {
          console.error('Failed to save session', err);
        }
      }, [auth]);

      const showNotification = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3200);
      };

      // PIN Handling (No hint displayed anywhere)
      const handlePinPress = (digit) => {
        if (pinInput.length < 6) {
          const nextPin = pinInput + digit;
          setPinInput(nextPin);
          setPinError(false);
          if (nextPin.length === 6) {
            if (nextPin === MASTER_PIN) {
              setAuth({ isAuthenticated: true, method: 'PIN', email: 'Master Admin' });
              setPinInput('');
              showNotification('Welcome to Udhaar Khata Pro!');
            } else {
              setPinError(true);
              setTimeout(() => setPinInput(''), 450);
            }
          }
        }
      };

      const handlePinBackspace = () => {
        setPinInput(prev => prev.slice(0, -1));
        setPinError(false);
      };

      // Google OAuth & Drive Sync
      const handleGoogleLogin = (isSyncOnly = false) => {
        const clientId = db.profile.googleClientId?.trim();
        if (!clientId) {
          if (!isSyncOnly) {
            showNotification('Configure Google Client ID in Settings first, or unlock via Security PIN.', 'error');
          } else {
            showNotification('Enter your Google OAuth Client ID first', 'error');
          }
          return;
        }

        if (!window.google || !window.google.accounts) {
          showNotification('Google Identity Services loading...', 'error');
          return;
        }

        try {
          const client = window.google.accounts.oauth2.initTokenClient({
            client_id: clientId,
            scope: 'https://www.googleapis.com/auth/drive.appdata email profile',
            callback: async (response) => {
              if (response.access_token) {
                setAccessToken(response.access_token);
                setDriveStatus('Connected to Google Drive');
                if (!auth.isAuthenticated) {
                  setAuth({ isAuthenticated: true, method: 'GMAIL', email: 'Google Verified Account' });
                }
                showNotification('Google Account Connected!');
              }
            }
          });
          client.requestAccessToken();
        } catch (err) {
          showNotification('OAuth initialization failed', 'error');
        }
      };

      const syncToGoogleDrive = async () => {
        if (!accessToken) {
          handleGoogleLogin(true);
          return;
        }
        try {
          setDriveStatus('Uploading to Google Drive...');
          const query = "name = 'udhaar_khata_database.json' and trashed = false";
          const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${encodeURIComponent(query)}`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const searchData = await searchRes.json();
          const existingFileId = searchData.files?.[0]?.id;

          const payload = { ...db, lastSynced: new Date().toLocaleString() };
          const metadata = {
            name: 'udhaar_khata_database.json',
            mimeType: 'application/json',
            ...(existingFileId ? {} : { parents: ['appDataFolder'] })
          };

          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' }));

          const uploadUrl = existingFileId
            ? `https://www.googleapis.com/upload/drive/v3/files/${existingFileId}?uploadType=multipart`
            : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;

          await fetch(uploadUrl, {
            method: existingFileId ? 'PATCH' : 'POST',
            headers: { Authorization: `Bearer ${accessToken}` },
            body: form
          });

          setDb(payload);
          setDriveStatus('Synced Successfully');
          showNotification('Backed up to Google Drive!');
        } catch (err) {
          setDriveStatus('Sync Failed');
          showNotification('Failed to sync with Google Drive', 'error');
        }
      };

      const restoreFromGoogleDrive = async () => {
        if (!accessToken) {
          handleGoogleLogin(true);
          return;
        }
        try {
          setDriveStatus('Searching Drive...');
          const query = "name = 'udhaar_khata_database.json' and trashed = false";
          const searchRes = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${encodeURIComponent(query)}`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const searchData = await searchRes.json();
          if (!searchData.files || searchData.files.length === 0) {
            setDriveStatus('No backup file found on Drive');
            showNotification('No backup found on Google Drive', 'error');
            return;
          }
          const fileId = searchData.files[0].id;
          const contentRes = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const restoredDb = await contentRes.json();
          setDb(restoredDb);
          setDriveStatus('Restored from Drive!');
          showNotification('Database restored from Google Drive!');
        } catch (e) {
          setDriveStatus('Restore Failed');
          showNotification('Error restoring from Drive', 'error');
        }
      };

      // Calculations
      const customerBalances = useMemo(() => {
        const map = {};
        db.customers.forEach(c => { map[c.id] = { gave: 0, got: 0, net: 0, lastActivity: c.createdAt }; });
        db.transactions.forEach(t => {
          if (!map[t.customerId]) map[t.customerId] = { gave: 0, got: 0, net: 0, lastActivity: t.date };
          if (t.type === 'GAVE') map[t.customerId].gave += Number(t.amount);
          else map[t.customerId].got += Number(t.amount);
          map[t.customerId].net = map[t.customerId].gave - map[t.customerId].got;
          if (t.date >= (map[t.customerId].lastActivity || '')) {
            map[t.customerId].lastActivity = t.date;
          }
        });
        return map;
      }, [db.customers, db.transactions]);

      const globalTotals = useMemo(() => {
        let totalLena = 0; // Positive net (You will get)
        let totalDena = 0; // Negative net (You will give)
        Object.values(customerBalances).forEach(b => {
          if (b.net > 0) totalLena += b.net;
          else if (b.net < 0) totalDena += Math.abs(b.net);
        });
        return { totalLena, totalDena, netMarket: totalLena - totalDena };
      }, [customerBalances]);

      const filteredCustomers = useMemo(() => {
        return db.customers
          .filter(c => {
            const matchesSearch = c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                  c.phone.includes(searchQuery);
            if (!matchesSearch) return false;
            const bal = customerBalances[c.id]?.net || 0;
            if (filterType === 'LENA') return bal > 0;
            if (filterType === 'DENA') return bal < 0;
            if (filterType === 'SETTLED') return bal === 0;
            return true;
          })
          .sort((a, b) => {
            const dateA = customerBalances[a.id]?.lastActivity || '';
            const dateB = customerBalances[b.id]?.lastActivity || '';
            return dateB.localeCompare(dateA);
          });
      }, [db.customers, customerBalances, searchQuery, filterType]);

      const selectedCustomer = useMemo(() => {
        return db.customers.find(c => c.id === selectedCustomerId) || null;
      }, [db.customers, selectedCustomerId]);

      // Selected Customer Passbook with Running Balance
      const customerPassbook = useMemo(() => {
        if (!selectedCustomerId) return [];
        const txs = db.transactions
          .filter(t => t.customerId === selectedCustomerId)
          .sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
        let running = 0;
        const withRunning = txs.map(t => {
          if (t.type === 'GAVE') running += Number(t.amount);
          else running -= Number(t.amount);
          return { ...t, runningBalance: running };
        });
        return withRunning.reverse(); // Newest at top
      }, [db.transactions, selectedCustomerId]);

      // Add or Edit Customer
      const openAddCustomer = () => {
        setEditingCustomer(null);
        setCustomerForm({ name: '', phone: '', address: '', openingBalance: '', openingType: 'GAVE' });
        setShowCustomerModal(true);
      };

      const openEditCustomer = (cust) => {
        setEditingCustomer(cust);
        setCustomerForm({ name: cust.name, phone: cust.phone, address: cust.address || '', openingBalance: '', openingType: 'GAVE' });
        setShowCustomerModal(true);
      };

      const handleSaveCustomer = (e) => {
        e.preventDefault();
        if (!customerForm.name.trim()) return;

        if (editingCustomer) {
          setDb(prev => ({
            ...prev,
            customers: prev.customers.map(c =>
              c.id === editingCustomer.id
                ? { ...c, name: customerForm.name.trim(), phone: customerForm.phone.trim(), address: customerForm.address.trim() }
                : c
            )
          }));
          showNotification('Customer details updated!');
        } else {
          const newId = 'c_' + Date.now();
          const today = new Date().toISOString().split('T')[0];
          const newCust = {
            id: newId,
            name: customerForm.name.trim(),
            phone: customerForm.phone.trim(),
            address: customerForm.address.trim(),
            createdAt: today
          };
          const newTxs = [...db.transactions];
          if (Number(customerForm.openingBalance) > 0) {
            newTxs.push({
              id: 't_' + Date.now(),
              customerId: newId,
              type: customerForm.openingType,
              amount: Number(customerForm.openingBalance),
              date: today,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              mode: 'Khata',
              billNo: 'OPENING',
              note: 'Opening Balance'
            });
          }
          setDb(prev => ({
            ...prev,
            customers: [newCust, ...prev.customers],
            transactions: newTxs
          }));
          showNotification('New party added!');
        }
        setShowCustomerModal(false);
      };

      const requestDeleteCustomer = (custId) => {
        setConfirmDialog({
          title: 'Delete Party & History?',
          message: 'This will permanently delete this customer and all their recorded transactions.',
          onConfirm: () => {
            setDb(prev => ({
              ...prev,
              customers: prev.customers.filter(c => c.id !== custId),
              transactions: prev.transactions.filter(t => t.customerId !== custId)
            }));
            setSelectedCustomerId(null);
            setShowCustomerModal(false);
            setConfirmDialog(null);
            showNotification('Customer deleted');
          }
        });
      };

      // Open Add OR Edit Transaction Modal
      const openNewTxModal = (type) => {
        setEditingTx(null);
        setTxForm({
          type,
          amount: '',
          date: new Date().toISOString().split('T')[0],
          mode: type === 'GAVE' ? 'Khata' : 'Cash',
          billNo: '',
          note: ''
        });
        setShowTxModal(true);
      };

      const openEditTxModal = (tx) => {
        setEditingTx(tx);
        setTxForm({
          type: tx.type,
          amount: String(tx.amount),
          date: tx.date,
          mode: tx.mode || 'Cash',
          billNo: tx.billNo || '',
          note: tx.note || ''
        });
        setShowTxModal(true);
      };

      const handleSaveTransaction = (e) => {
        e.preventDefault();
        if (!txForm.amount || Number(txForm.amount) <= 0) return;

        if (editingTx) {
          setDb(prev => ({
            ...prev,
            transactions: prev.transactions.map(t =>
              t.id === editingTx.id
                ? {
                    ...t,
                    type: txForm.type,
                    amount: Number(txForm.amount),
                    date: txForm.date,
                    mode: txForm.mode,
                    billNo: txForm.billNo.trim(),
                    note: txForm.note.trim()
                  }
                : t
            )
          }));
          showNotification('Transaction updated!');
        } else {
          const newTx = {
            id: 't_' + Date.now(),
            customerId: selectedCustomerId,
            type: txForm.type,
            amount: Number(txForm.amount),
            date: txForm.date,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            mode: txForm.mode,
            billNo: txForm.billNo.trim(),
            note: txForm.note.trim() || (txForm.type === 'GAVE' ? 'Goods Sold on Credit' : 'Payment Received')
          };
          setDb(prev => ({
            ...prev,
            transactions: [...prev.transactions, newTx]
          }));
          showNotification('Entry saved to Khata!');
        }
        setShowTxModal(false);
        setEditingTx(null);
      };

      const requestDeleteTransaction = (txId) => {
        setConfirmDialog({
          title: 'Delete Transaction Entry?',
          message: 'Are you sure you want to remove this entry from the ledger? Running balances will recalculate automatically.',
          onConfirm: () => {
            setDb(prev => ({
              ...prev,
              transactions: prev.transactions.filter(t => t.id !== txId)
            }));
            setShowTxModal(false);
            setEditingTx(null);
            setConfirmDialog(null);
            showNotification('Transaction deleted');
          }
        });
      };

      // WhatsApp Reminder
      const sendWhatsAppReminder = (customer) => {
        const bal = customerBalances[customer.id]?.net || 0;
        const cleanPhone = customer.phone.replace(/\D/g, '');
        const phoneWithCode = cleanPhone.length === 10 ? `91${cleanPhone}` : cleanPhone;
        let msg = '';
        if (bal > 0) {
          msg = `Namaste *${customer.name}* ji,\n\nYour current pending Udhaar balance at *${db.profile.businessName}* is *₹${bal.toLocaleString('en-IN')}*.\n\nKindly clear the dues at your earliest convenience. You can pay via UPI to: *${db.profile.upiId}*\n\nThank you!\n${db.profile.businessName}`;
        } else if (bal < 0) {
          msg = `Namaste *${customer.name}* ji,\n\nYour advance credit balance with *${db.profile.businessName}* is *₹${Math.abs(bal).toLocaleString('en-IN')}*.\n\nThank you!\n${db.profile.businessName}`;
        } else {
          msg = `Namaste *${customer.name}* ji,\n\nYour Khata account at *${db.profile.businessName}* is completely settled (Balance: ₹0).\n\nThank you!`;
        }
        window.open(`https://wa.me/${phoneWithCode}?text=${encodeURIComponent(msg)}`, '_blank');
      };

      // Export PDF Statement
      const downloadPdfStatement = () => {
        const element = document.getElementById('pdf-statement-area');
        if (!element) return;
        const opt = {
          margin: 8,
          filename: `${selectedCustomer?.name || 'Khata'}_Statement.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2 },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        if (window.html2pdf) {
          window.html2pdf().set(opt).from(element).save();
          showNotification('Downloading PDF Statement...');
        } else {
          window.print();
        }
      };

      // Export / Import JSON File
      const exportJsonBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", `udhaar_khata_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
        showNotification('Backup JSON downloaded!');
      };

      const importJsonBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            if (parsed.customers && parsed.transactions) {
              setDb(parsed);
              showNotification('Database restored successfully!');
            } else {
              showNotification('Invalid backup file format', 'error');
            }
          } catch {
            showNotification('Failed to read backup file', 'error');
          }
        };
        reader.readAsText(file);
      };

      // ==========================================
      // 1. GATEKEEPER LOCK SCREEN (NO PIN HINT)
      // ==========================================
      if (!auth.isAuthenticated) {
        return (
          <div className="min-h-screen bg-slate-950 text-white flex flex-col justify-between items-center p-5 select-none">
            {toast && (
              <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full text-xs font-bold text-white shadow-xl ${
                toast.type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'
              }`}>
                {toast.msg}
              </div>
            )}

            <div className="w-full max-w-sm mt-4 flex flex-col items-center">
              <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 mb-3">
                <svg className="w-9 h-9 text-slate-950" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25" />
                </svg>
              </div>
              <h1 className="text-2xl font-extrabold tracking-tight">Udhaar Khata Pro</h1>
              <p className="text-xs text-slate-400 mt-1">Secure Digital Bahi-Khata & Cloud Ledger</p>

              {/* Auth Switch Tabs */}
              <div className="grid grid-cols-2 bg-slate-900 p-1 rounded-xl w-full mt-6 border border-slate-800">
                <button
                  onClick={() => setLoginTab('PIN')}
                  className={`py-2 text-xs font-bold rounded-lg transition ${loginTab === 'PIN' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400'}`}
                >
                  Security PIN
                </button>
                <button
                  onClick={() => setLoginTab('GMAIL')}
                  className={`py-2 text-xs font-bold rounded-lg transition ${loginTab === 'GMAIL' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400'}`}
                >
                  Gmail Login
                </button>
              </div>

              {loginTab === 'PIN' ? (
                <div className="w-full flex flex-col items-center mt-6">
                  <p className="text-xs uppercase tracking-widest text-slate-400 mb-4 font-semibold">

                  <div className="flex items-center justify-between pb-3 border-b border-slate-200">

                      {editingTx ? '✏️ Edit Transaction Entry' : txForm.type === 'GAVE' ? '↑ Record Udhaar (You Gave)' : '↓ Record Payment (You Got)'}
                    </h3>
                    <button onClick={() => setShowTxModal(false)} className="text-slate-400 font-bold text-lg">✕</button>
                  </div>

                  <form onSubmit={handleSaveTransaction} className="space-y-3 mt-3">
                    {/* Transaction Type Switcher */}
                    <div className="grid grid-cols-2 gap-2 bg-slate-100 p-1 rounded-xl">
                      <button
                        type="button"
                        onClick={() => setTxForm({ ...txForm, type: 'GAVE' })}
                        className={`py-2 rounded-lg text-xs font-extrabold transition ${
                          txForm.type === 'GAVE' ? 'bg-rose-600 text-white shadow' : 'text-slate-600'
                        }`}
                      >
                        ↑ YOU GAVE (Udhaar)
                      </button>
                      <button
                        type="button"
                        onClick={() => setTxForm({ ...txForm, type: 'GOT' })}
                        className={`py-2 rounded-lg text-xs font-extrabold transition ${
                          txForm.type === 'GOT' ? 'bg-emerald-600 text-white shadow' : 'text-slate-600'
                        }`}
                      >
                        ↓ YOU GOT (Jama)
                      </button>
                    </div>

                    <div>
                      <label className="text-[11px] font-bold text-slate-600">Amount (₹) *</label>
                      <input
                        type="number"
                        required
                        autoFocus
                        placeholder="0.00"
                        value={txForm.amount}
                        onChange={(e) => setTxForm({ ...txForm, amount: e.target.value })}
                        className="w-full mt-1 px-3.5 py-3 border-2 border-slate-300 rounded-xl text-xl font-black text-slate-900 focus:outline-none focus:border-slate-900"
                      />
                    </div>

                    <div className="grid grid-cols-2 gap-2.5">
                      <div>
                        <label className="text-[11px] font-bold text-slate-600">Date</label>
                        <input
                          type="date"
                          value={txForm.date}
                          onChange={(e) => setTxForm({ ...txForm, date: e.target.value })}
                          className="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold"
                        />
                      </div>
                      <div>
                        <label className="text-[11px] font-bold text-slate-600">Payment Mode</label>
                        <select
                          value={txForm.mode}
                          onChange={(e) => setTxForm({ ...txForm, mode: e.target.value })}
                          className="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold bg-white"
                        >
                          <option value="Cash">Cash</option>
                          <option value="UPI">UPI / QR</option>
                          <option value="Khata">Khata Credit</option>
                          <option value="Bank">Bank / Cheque</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-3 gap-2.5">
                      <div className="col-span-1">
                        <label className="text-[11px] font-bold text-slate-600">Bill No.</label>
                        <input
                          type="text"
                          placeholder="INV-01"
                          value={txForm.billNo}
                          onChange={(e) => setTxForm({ ...txForm, billNo: e.target.value })}
                          className="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold"
                        />
                      </div>
                      <div className="col-span-2">
                        <label className="text-[11px] font-bold text-slate-600">Item Details / Note</label>
                        <input
                          type="text"
                          placeholder="e.g., 5kg Sugar, Rice, Part Cash"
                          value={txForm.note}
                          onChange={(e) => setTxForm({ ...txForm, note: e.target.value })}
                          className="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold"
                        />
                      </div>
                    </div>

                    <div className="flex gap-2 pt-2">
                      {editingTx && (
                        <button
                          type="button"
                          onClick={() => requestDeleteTransaction(editingTx.id)}
                          className="px-4 py-3 rounded-xl bg-rose-100 text-rose-700 font-extrabold text-xs hover:bg-rose-200"
                        >
                          🗑️ Delete
                        </button>
                      )}
                      <button
                        type="submit"
                        className={`flex-1 py-3 rounded-xl text-white font-extrabold text-sm shadow-lg ${
                          txForm.type === 'GAVE' ? 'bg-rose-600' : 'bg-emerald-600'
                        }`}
                      >
                        {editingTx ? 'Update Entry' : 'Save Entry'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* ==========================================
                MODAL 2: ADD OR EDIT CUSTOMER
               ========================================== */}
            {showCustomerModal && (
              <div className="fixed inset-0 bg-slate-950/70 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                    <h3 className="font-extrabold text-base text-slate-900">
                      {editingCustomer ? '✏️ Edit Party Details' : '+ Add New Customer Party'}
                    </h3>
                    <button onClick={() => setShowCustomerModal(false)} className="text-slate-400 font-bold text-lg">✕</button>
                  </div>

                  <form onSubmit={handleSaveCustomer} className="space-y-3 mt-3">
                    <div>
                      <label className="text-[11px] font-bold text-slate-600">Customer Name *</label>
                      <input
                        type="text"
                        required
                        placeholder="e.g., Rajesh Sharma"
                        value={customerForm.name}
                        onChange={(e) => setCustomerForm({ ...customerForm, name: e.target.value })}
                        className="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-slate-600">WhatsApp / Mobile Number</label>
                      <input
                        type="tel"
                        placeholder="10-digit mobile number"
                        value={customerForm.phone}
                        onChange={(e) => setCustomerForm({ ...customerForm, phone: e.target.value })}
                        className="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold"
                      />
                    </div>
                    <div>
                      <label className="text-[11px] font-bold text-slate-600">Address / Note</label>
                      <input
                        type="text"
                        placeholder="Shop or street address"
                        value={customerForm.address}
                        onChange={(e) => setCustomerForm({ ...customerForm, address: e.target.value })}
                        className="w-full mt-1 px-3 py-2.5 border border-slate-300 rounded-xl text-xs font-semibold"
                      />
                    </div>

                    {!editingCustomer && (
                      <div className="grid grid-cols-2 gap-2 pt-1">
                        <div>
                          <label className="text-[11px] font-bold text-slate-600">Opening Balance (₹)</label>
                          <input
                            type="number"
                            placeholder="0"
                            value={customerForm.openingBalance}
                            onChange={(e) => setCustomerForm({ ...customerForm, openingBalance: e.target.value })}
                            className="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] font-bold text-slate-600">Balance Type</label>
                          <select
                            value={customerForm.openingType}
                            onChange={(e) => setCustomerForm({ ...customerForm, openingType: e.target.value })}
                            className="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-xs font-semibold bg-white"
                          >
                            <option value="GAVE">You Gave (Lena)</option>
                            <option value="GOT">You Got (Dena)</option>
                          </select>
                        </div>
                      </div>
                    )}

                    <div className="flex gap-2 pt-2">
                      {editingCustomer && (
                        <button
                          type="button"
                          onClick={() => requestDeleteCustomer(editingCustomer.id)}
                          className="px-4 py-3 rounded-xl bg-rose-100 text-rose-700 font-extrabold text-xs"
                        >
                          🗑️ Delete Party
                        </button>
                      )}
                      <button
                        type="submit"
                        className="flex-1 py-3 rounded-xl bg-slate-900 text-white font-extrabold text-sm"
                      >
                        {editingCustomer ? 'Save Changes' : 'Create Party'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* ==========================================
                MODAL 3: PDF STATEMENT PREVIEW & EXPORT
               ========================================== */}
            {showPdfModal && selectedCustomer && (
              <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-3 overflow-y-auto">
                <div className="bg-white w-full max-w-lg rounded-2xl p-4 shadow-2xl max-h-[92vh] flex flex-col">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-200">
                    <h3 className="font-extrabold text-sm text-slate-900">📄 Customer Khata PDF Statement</h3>
                    <button onClick={() => setShowPdfModal(false)} className="text-slate-400 font-bold">✕</button>
                  </div>

                  <div className="flex-1 overflow-y-auto my-3 border border-slate-200 rounded-xl p-4 bg-white" id="pdf-statement-area">
                    <div className="border-b-2 border-slate-900 pb-3 flex justify-between items-start">
                      <div>
                        <h1 className="text-lg font-black text-slate-900">{db.profile.businessName}</h1>
                        <p className="text-xs text-slate-600">{db.profile.address}</p>
                        <p className="text-xs text-slate-600">Phone: {db.profile.phone} | UPI: {db.profile.upiId}</p>
                      </div>
                      <div className="text-right">
                        <span className="text-xs font-extrabold uppercase bg-slate-900 text-white px-2 py-1 rounded">
                          Account Statement
                        </span>
                        <p className="text-[11px] text-slate-500 mt-1">Date: {new Date().toISOString().split('T')[0]}</p>
                      </div>
                    </div>

                    <div className="my-3 bg-slate-50 p-3 rounded-lg border border-slate-200 flex justify-between items-center">
                      <div>
                        <p className="text-[10px] uppercase font-bold text-slate-400">Customer Party</p>
                        <p className="text-sm font-extrabold text-slate-900">{selectedCustomer.name}</p>
                        <p className="text-xs text-slate-600">{selectedCustomer.phone} {selectedCustomer.address ? `• ${selectedCustomer.address}` : ''}</p>
                      </div>
                      <div className="text-right">
                        <p className="text-[10px] uppercase font-bold text-slate-400">Net Closing Balance</p>
                        {(() => {
                          const net = customerBalances[selectedCustomer.id]?.net || 0;
                          return (
                            <p className={`text-base font-black ${net > 0 ? 'text-rose-600' : net < 0 ? 'text-emerald-600' : 'text-slate-800'}`}>
                              ₹{Math.abs(net).toLocaleString('en-IN')} {net > 0 ? '(Due / Lena)' : net < 0 ? '(Advance)' : '(Settled)'}
                            </p>
                          );
                        })()}
                      </div>
                    </div>

                    <table className="w-full text-left border-collapse text-xs mt-2">
                      <thead>
                        <tr className="bg-slate-900 text-white">
                          <th className="p-2">Date</th>
                          <th className="p-2">Particulars</th>
                          <th className="p-2 text-right">Debit (Gave)</th>
                          <th className="p-2 text-right">Credit (Got)</th>
                          <th className="p-2 text-right">Balance</th>
                        </tr>
                      </thead>
                      <tbody>
                        {customerPassbook.slice().reverse().map(tx => (
                          <tr key={tx.id} className="border-b border-slate-200">
                            <td className="p-2 whitespace-nowrap">{tx.date}</td>
                            <td className="p-2">{tx.note} {tx.billNo ? `(#${tx.billNo})` : ''}</td>
                            <td className="p-2 text-right text-rose-600 font-bold">
                              {tx.type === 'GAVE' ? `₹${Number(tx.amount).toLocaleString('en-IN')}` : '-'}
                            </td>
                            <td className="p-2 text-right text-emerald-600 font-bold">
                              {tx.type === 'GOT' ? `₹${Number(tx.amount).toLocaleString('en-IN')}` : '-'}
                            </td>
                            <td className="p-2 text-right font-bold">
                              ₹{Math.abs(tx.runningBalance).toLocaleString('en-IN')} {tx.runningBalance > 0 ? 'Dr' : tx.runningBalance < 0 ? 'Cr' : ''}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                  <div className="flex gap-2">
                    <button
                      onClick={downloadPdfStatement}
                      className="flex-1 py-3 bg-emerald-600 text-white rounded-xl font-extrabold text-xs shadow"
                    >
                      ⬇️ Download PDF Statement
                    </button>
                    <button
                      onClick={() => setShowPdfModal(false)}
                      className="px-4 py-3 bg-slate-200 text-slate-700 rounded-xl font-bold text-xs"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* ==========================================
                MODAL 4: GOOGLE DRIVE CLOUD SYNC HUB
               ========================================== */}
            {showDriveModal && (
              <div className="fixed inset-0 bg-slate-950/75 z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-md rounded-3xl p-5 shadow-2xl space-y-4">
                  <div className="flex items-center justify-between border-b border-slate-200 pb-3">
                    <h3 className="font-extrabold text-base text-slate-900">☁️ Google Drive Backup & Sync</h3>
                    <button onClick={() => setShowDriveModal(false)} className="text-slate-400 font-bold">✕</button>
                  </div>

                  <div className="bg-slate-100 p-3 rounded-xl text-xs">
                    <p className="font-bold text-slate-700">Status: <span className="text-emerald-600">{driveStatus}</span></p>
                    <p className="text-slate-500 mt-0.5">Last Synced: {db.lastSynced || 'Never'}</p>
                  </div>

                  <div>
                    <label className="text-[11px] font-bold text-slate-600">Google OAuth 2.0 Client ID (Optional for Live API)</label>
                    <input
                      type="text"
                      placeholder="xxxx.apps.googleusercontent.com"
                      value={db.profile.googleClientId || ''}
                      onChange={(e) => setDb({ ...db, profile: { ...db.profile, googleClientId: e.target.value } })}
                      className="w-full mt-1 px-3 py-2 border border-slate-300 rounded-xl text-xs font-mono"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <button
                      onClick={syncToGoogleDrive}
                      className="py-3 bg-emerald-600 text-white rounded-xl font-extrabold text-xs shadow"
                    >
                      ⬆️ Backup to G-Drive
                    </button>
                    <button
                      onClick={restoreFromGoogleDrive}
                      className="py-3 bg-slate-900 text-white rounded-xl font-extrabold text-xs shadow"
                    >
                      ⬇️ Restore from Drive
                    </button>
                  </div>

                  <div className="border-t border-slate-200 pt-3">
                    <p className="text-[11px] font-bold text-slate-500 mb-2">Direct Offline File Backup (No Client ID Needed):</p>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={exportJsonBackup}
                        className="py-2.5 bg-slate-100 border border-slate-300 rounded-xl text-xs font-bold text-slate-800"
                      >
                        💾 Download Backup
                      </button>
                      <label className="py-2.5 bg-slate-100 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 text-center cursor-pointer">
                        📂 Upload Backup
                        <input type="file" accept=".json" onChange={importJsonBackup} className="hidden" />
                      </label>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ==========================================
                MODAL 5: CUSTOM CONFIRMATION DIALOG
               ========================================== */}
            {confirmDialog && (
              <div className="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-xs rounded-2xl p-5 shadow-2xl text-center space-y-3">
                  <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 mx-auto flex items-center justify-center text-xl font-bold">
                    !
                  </div>
                  <h4 className="font-extrabold text-base text-slate-900">{confirmDialog.title}</h4>
                  <p className="text-xs text-slate-500 leading-relaxed">{confirmDialog.message}</p>
                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button
                      onClick={() => setConfirmDialog(null)}
                      className="py-2.5 rounded-xl bg-slate-100 text-slate-700 font-bold text-xs"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={confirmDialog.onConfirm}
                      className="py-2.5 rounded-xl bg-rose-600 text-white font-extrabold text-xs shadow"
                    >
                      Yes, Delete
                    </button>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
```
